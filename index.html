<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Mode Browser + Editor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
                    },
                    colors: {
                        primary: '#18181b',
                        accent: '#3b82f6',
                    },
                    typography: {
                        DEFAULT: {
                            css: {
                                maxWidth: '100%',
                                color: '#334155',
                                h1: { color: '#18181b', fontWeight: '700' },
                                a: { color: '#3b82f6', textDecoration: 'none' },
                            },
                        },
                    },
                },
            },
        }
    </script>
    <style>
        body { background-color: #f8fafc; }
        
        /* Zen Mode */
        body.zen-mode header,
        body.zen-mode #editor-pane { display: none !important; }
        body.zen-mode main { padding: 0; gap: 0; }
        body.zen-mode #viewer-pane { width: 100%; max-width: 720px; margin: 0 auto; border-radius: 0; box-shadow: none; height: 100vh; }
        
        /* UI Animations */
        #spotlight-overlay, #modal-overlay {
            transition: opacity 0.2s ease-out;
        }
        #spotlight-box, #modal-box {
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .ui-hidden {
            opacity: 0;
            pointer-events: none;
        }
        .ui-hidden #spotlight-box, .ui-hidden #modal-box {
            transform: scale(0.95) translateY(-20px);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

        /* Content Styles */
        .extracted-content img {
            max-width: 100%;
            height: auto;
            border-radius: 0.5rem;
            margin: 1.5rem 0;
        }
        .extracted-content p {
            margin-bottom: 1.25em;
            line-height: 1.8;
        }
        .extracted-content h2 {
            font-size: 1.5em;
            font-weight: 700;
            margin-top: 2em;
            margin-bottom: 1em;
            color: #1e293b;
        }
        .extracted-content ul, .extracted-content ol {
            margin-bottom: 1.25em;
            padding-left: 1.5em;
            list-style-type: disc;
        }
        .extracted-content blockquote {
            border-left: 4px solid #cbd5e1;
            padding-left: 1em;
            color: #64748b;
            font-style: italic;
        }
    </style>
</head>
<body class="h-screen flex flex-col text-slate-800 font-sans overflow-hidden">

    <!-- Spotlight Search Overlay -->
    <div id="spotlight-overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] flex justify-center pt-[15vh] ui-hidden">
        <div id="spotlight-box" class="w-full max-w-2xl mx-4">
            <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden">
                <form id="spotlight-form" class="flex items-center p-5 gap-4">
                    <i data-lucide="link" id="input-icon" class="w-6 h-6 text-slate-400"></i>
                    <input type="text" id="spotlight-input" placeholder="URLを入力、またはHTMLソースを貼り付け..." 
                        class="flex-1 bg-transparent text-xl outline-none text-slate-800 placeholder:text-slate-300">
                    <div class="flex items-center gap-2">
                        <button type="submit" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-600 transition-colors md:hidden">
                            <i data-lucide="arrow-right" class="w-5 h-5"></i>
                        </button>
                        <kbd class="hidden md:block px-2 py-1 text-xs font-semibold text-slate-400 bg-slate-100 border border-slate-200 rounded-md">Enter</kbd>
                    </div>
                </form>
                <div class="px-5 py-3 bg-slate-50 border-t border-slate-100 flex justify-between items-center text-[10px] text-slate-400 uppercase tracking-widest font-bold">
                    <span>Press ESC to close</span>
                    <span id="input-type-indicator" class="px-2 py-0.5 rounded bg-slate-200 text-slate-500 transition-colors">URL MODE</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="modal-overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[110] flex items-center justify-center ui-hidden">
        <div id="modal-box" class="w-full max-w-sm mx-4 bg-white rounded-xl shadow-2xl p-6 border border-slate-200">
            <h3 class="text-lg font-bold text-slate-900 mb-2">メモを消去しますか？</h3>
            <p class="text-sm text-slate-500 mb-6">この操作は取り消せません。現在のメモの内容は完全に削除されます。</p>
            <div class="flex justify-end gap-3">
                <button id="modal-cancel" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">キャンセル</button>
                <button id="modal-confirm" class="px-4 py-2 text-sm font-medium text-white bg-red-500 hover:bg-red-600 rounded-lg transition-colors shadow-sm">削除する</button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="h-16 flex items-center px-4 md:px-6 justify-between shrink-0 bg-white/80 backdrop-blur-md border-b border-slate-200/60 z-10">
        <div class="flex items-center gap-3 shrink-0">
            <div class="bg-primary text-white p-1.5 rounded-lg shadow-sm">
                <i data-lucide="book-open" class="w-5 h-5"></i>
            </div>
            <span class="font-bold text-lg tracking-tight hidden sm:block text-slate-900">TextMode</span>
        </div>

        <!-- Trigger Button -->
        <button id="open-spotlight" class="flex-1 max-w-md mx-4 bg-slate-100 hover:bg-slate-200/70 border border-slate-200 text-slate-500 px-4 py-2 rounded-xl text-sm transition-all flex items-center justify-between group shadow-inner">
            <div class="flex items-center gap-2 truncate">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 shrink-0"></i>
                <span id="header-placeholder-text" class="truncate">URLまたはHTMLを入力...</span>
            </div>
            <kbd class="hidden md:block px-1.5 py-0.5 text-[10px] font-bold text-slate-400 bg-white border border-slate-200 rounded-md shrink-0">⌘ K</kbd>
        </button>

        <div class="flex items-center gap-2">
            <button id="zen-toggle" class="p-2.5 text-slate-500 hover:text-primary hover:bg-slate-100 rounded-lg transition-colors" title="Zen Mode">
                <i data-lucide="expand" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden p-0 md:p-4 gap-4">
        
        <!-- Viewer Pane -->
        <section id="viewer-pane" class="flex-1 overflow-y-auto bg-white md:rounded-2xl shadow-sm border border-slate-200/60 transition-all scroll-smooth">
            <div class="max-w-3xl mx-auto px-6 py-10 md:px-12 md:py-14">
                <article id="content-display" class="prose prose-slate prose-lg max-w-none">
                    <h1 class="!text-4xl !font-extrabold !mb-8 tracking-tight text-slate-900">Ready to Read.</h1>
                    <p class="lead text-slate-600">
                        上の検索バーをクリックするか、<code>⌘ + K</code> を押して読み込みを開始してください。
                    </p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 my-8">
                        <div class="p-4 rounded-xl border border-slate-100 bg-slate-50">
                            <h3 class="text-sm font-bold mb-2 flex items-center gap-2"><i data-lucide="link" class="w-4 h-4 text-accent"></i>URLから読み込む</h3>
                            <p class="text-xs text-slate-500 leading-relaxed">ニュースサイトやブログのURLを入力すると、本文を抽出して表示します。</p>
                        </div>
                        <div class="p-4 rounded-xl border border-slate-100 bg-slate-50">
                            <h3 class="text-sm font-bold mb-2 flex items-center gap-2"><i data-lucide="code" class="w-4 h-4 text-green-500"></i>HTMLを貼り付け</h3>
                            <p class="text-xs text-slate-500 leading-relaxed">コピーしたソースコードをそのまま貼り付けると、クリーンな表示に変換します。</p>
                        </div>
                    </div>
                </article>
            </div>
        </section>

        <!-- Editor Pane -->
        <section id="editor-pane" class="w-full md:w-1/3 lg:w-[28%] bg-white md:rounded-2xl shadow-sm border border-slate-200/60 flex flex-col shrink-0">
            <div class="h-14 border-b border-slate-100 px-4 flex items-center justify-between shrink-0">
                <div class="flex items-center gap-2 text-slate-400">
                    <i data-lucide="edit-3" class="w-4 h-4"></i>
                    <span class="text-xs font-semibold uppercase tracking-wider">Notes</span>
                </div>
                <div class="flex gap-1">
                    <button id="quote-btn" class="p-2 hover:bg-slate-50 rounded-lg text-slate-400 transition-colors" title="選択範囲を引用">
                        <i data-lucide="quote" class="w-4 h-4"></i>
                    </button>
                    <button id="copy-note-btn" class="p-2 hover:bg-slate-50 rounded-lg text-slate-400 transition-colors" title="コピー">
                        <i data-lucide="copy" class="w-4 h-4"></i>
                    </button>
                    <button id="clear-note-btn" class="p-2 hover:bg-red-50 hover:text-red-500 rounded-lg text-slate-400 transition-colors" title="削除">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
            <textarea id="editor-area" class="flex-1 w-full bg-transparent p-6 resize-none text-slate-700 leading-relaxed text-sm outline-none" placeholder="ここにメモを残す..."></textarea>
            <div id="save-status" class="absolute bottom-4 right-6 text-[10px] font-bold text-slate-400 uppercase opacity-0 transition-opacity flex items-center gap-1 bg-white px-2 py-1 rounded-full shadow-sm border border-slate-100 pointer-events-none">
                <span class="w-1.5 h-1.5 rounded-full bg-green-500"></span>
                Saved
            </div>
        </section>
    </main>

    <script>
        // Initialize Icons
        lucide.createIcons();
        
        // DOM Elements
        const dom = {
            spotlightOverlay: document.getElementById('spotlight-overlay'),
            spotlightInput: document.getElementById('spotlight-input'),
            spotlightForm: document.getElementById('spotlight-form'),
            openSpotlight: document.getElementById('open-spotlight'),
            typeIndicator: document.getElementById('input-type-indicator'),
            inputIcon: document.getElementById('input-icon'),
            contentDisplay: document.getElementById('content-display'),
            editorArea: document.getElementById('editor-area'),
            zenToggle: document.getElementById('zen-toggle'),
            quoteBtn: document.getElementById('quote-btn'),
            copyNoteBtn: document.getElementById('copy-note-btn'),
            clearNoteBtn: document.getElementById('clear-note-btn'),
            saveStatus: document.getElementById('save-status'),
            modalOverlay: document.getElementById('modal-overlay'),
            modalConfirm: document.getElementById('modal-confirm'),
            modalCancel: document.getElementById('modal-cancel'),
        };

        let currentId = 'default';

        // --- Spotlight UI Management ---
        function openSpotlight() {
            dom.spotlightOverlay.classList.remove('ui-hidden');
            dom.spotlightInput.focus();
        }

        function closeSpotlight() {
            dom.spotlightOverlay.classList.add('ui-hidden');
            dom.spotlightInput.value = '';
            updateInputType('');
        }

        function updateInputType(val) {
            const v = val.trim();
            const isHTML = v.startsWith('<') || v.includes('</div>') || v.includes('</p>');
            if (isHTML && v.length > 5) {
                dom.typeIndicator.innerText = 'HTML MODE';
                dom.typeIndicator.classList.remove('bg-slate-200', 'text-slate-500');
                dom.typeIndicator.classList.add('bg-green-100', 'text-green-700');
                dom.inputIcon.innerHTML = '<path d="m18 16 4-4-4-4"></path><path d="m6 8-4 4 4 4"></path><path d="m14.5 4-5 16"></path>'; 
            } else {
                dom.typeIndicator.innerText = 'URL MODE';
                dom.typeIndicator.classList.add('bg-slate-200', 'text-slate-500');
                dom.typeIndicator.classList.remove('bg-green-100', 'text-green-700');
                dom.inputIcon.innerHTML = '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>';
            }
        }

        // --- Confirmation Modal Logic ---
        function openModal(callback) {
            dom.modalOverlay.classList.remove('ui-hidden');
            
            const handleConfirm = () => {
                callback();
                closeModal();
            };
            
            const handleCancel = () => {
                closeModal();
            };

            // Remove old listeners to prevent stacking (simple implementation)
            dom.modalConfirm.onclick = handleConfirm;
            dom.modalCancel.onclick = handleCancel;
        }

        function closeModal() {
            dom.modalOverlay.classList.add('ui-hidden');
            dom.modalConfirm.onclick = null;
            dom.modalCancel.onclick = null;
        }

        // --- Event Listeners ---
        dom.openSpotlight.addEventListener('click', openSpotlight);
        
        dom.spotlightOverlay.addEventListener('click', (e) => {
            if (e.target === dom.spotlightOverlay) closeSpotlight();
        });

        dom.modalOverlay.addEventListener('click', (e) => {
            if (e.target === dom.modalOverlay) closeModal();
        });

        window.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                e.preventDefault();
                openSpotlight();
            }
            if (e.key === 'Escape') {
                closeSpotlight();
                closeModal();
            }
        });

        dom.spotlightInput.addEventListener('input', (e) => updateInputType(e.target.value));

        dom.spotlightForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const val = dom.spotlightInput.value.trim();
            if (!val) return;

            const isHTML = dom.typeIndicator.innerText === 'HTML MODE';
            if (isHTML) {
                const result = extractContent(val);
                displayContent(result.title, result.content, 'Direct HTML Paste');
                currentId = 'html_' + Date.now();
                loadNote();
            } else {
                let url = val;
                if (!url.startsWith('http')) url = 'https://' + url;
                fetchUrl(url);
            }
            closeSpotlight();
        });

        // --- Core Content Logic ---
        function extractContent(htmlString) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlString, 'text/html');
            
            // Clean up unwanted elements
            const toRemove = doc.querySelectorAll('script, style, iframe, nav, footer, aside, .ad, noscript, header:not(article header), .cookie-banner, .popup');
            toRemove.forEach(el => el.remove());

            // Image handling: Ensure they have sources and remove empty ones
            doc.querySelectorAll('img').forEach(img => {
                if(!img.src) img.remove();
                // Fix relative URLs if base tag provided? (Out of scope for simple paste, but good for URL fetch)
                img.removeAttribute('srcset'); // simplify
                img.removeAttribute('style');
                img.removeAttribute('class');
            });

            // Find main content
            let contentNode = doc.querySelector('article') || 
                              doc.querySelector('main') || 
                              doc.querySelector('.post-body') || 
                              doc.querySelector('.entry-content') ||
                              doc.querySelector('#content');
            
            // Fallback: Find div with most paragraphs
            if (!contentNode) {
                const divs = doc.querySelectorAll('div');
                let maxP = 0;
                divs.forEach(div => {
                    // Score based on p tags and text length
                    const pCount = div.querySelectorAll('p').length;
                    if (pCount > maxP) {
                        maxP = pCount;
                        contentNode = div;
                    }
                });
            }
            
            if (!contentNode) contentNode = doc.body;

            const title = doc.querySelector('h1')?.innerText || doc.querySelector('title')?.innerText || 'Untitled Content';

            return { title, content: contentNode.innerHTML };
        }

        function displayContent(title, html, url = '') {
            let metaHtml = '';
            if (url) {
                metaHtml = `
                    <div class="mb-6 flex flex-col gap-1 border-b border-slate-100 pb-6">
                        <div class="flex items-center gap-2 text-xs font-bold text-slate-400 uppercase tracking-widest">
                            <i data-lucide="globe" class="w-3.5 h-3.5"></i>
                            <span>Source URL</span>
                        </div>
                        <a href="${url}" target="_blank" class="text-sm text-accent hover:underline break-all flex items-center gap-1.5 font-medium">
                            ${url}
                            <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                        </a>
                    </div>
                `;
            }

            dom.contentDisplay.innerHTML = `
                ${metaHtml}
                <h1 class="text-3xl md:text-4xl font-extrabold mb-8 text-slate-900 tracking-tight leading-tight">${title}</h1>
                <div class="extracted-content prose-headings:text-slate-900 prose-p:leading-relaxed">
                    ${html}
                </div>
            `;
            document.getElementById('viewer-pane').scrollTop = 0;
            lucide.createIcons();
        }

        async function fetchUrl(url) {
            dom.contentDisplay.innerHTML = `
                <div class="flex flex-col items-center justify-center h-64 text-slate-400">
                    <div class="w-8 h-8 border-2 border-slate-200 border-t-primary rounded-full animate-spin mb-4"></div>
                    <p class="text-sm font-medium">Fetching from ${new URL(url).hostname}...</p>
                </div>`;
            
            try {
                // Use AllOrigins proxy
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}&timestamp=${Date.now()}`;
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error('Network response failed');
                
                const data = await response.json();
                if (!data || !data.contents) throw new Error('No content received');
                
                const result = extractContent(data.contents);
                displayContent(result.title, result.content, url);
                
                // Create a unique ID for notes based on URL
                currentId = btoa(url).slice(0, 16).replace(/[^a-zA-Z0-9]/g, '');
                loadNote();
            } catch (error) {
                console.error('Fetch Error:', error);
                dom.contentDisplay.innerHTML = `
                    <div class="p-6 bg-red-50 border border-red-100 rounded-xl text-red-700">
                        <div class="flex items-center gap-2 mb-2 font-bold">
                            <i data-lucide="alert-circle" class="w-5 h-5"></i>
                            読み込みに失敗しました
                        </div>
                        <p class="text-sm opacity-80 mb-4">
                            URL: <code class="bg-red-100 px-1 rounded break-all">${url}</code><br>
                            一部のサイトはセキュリティ制限(CORS)によりプロキシ経由でも読み込めない場合があります。
                        </p>
                        <div class="text-xs font-semibold uppercase tracking-wider text-red-400 mb-2">解決策:</div>
                        <ul class="text-xs space-y-1 list-disc pl-4 opacity-80">
                            <li>ブラウザでページを開き、ソースを表示(Ctrl+U)して全コピー、ここに貼り付けてください。</li>
                            <li>URLが正しいか（特に https:// の有無）確認してください。</li>
                        </ul>
                    </div>`;
                lucide.createIcons();
            }
        }

        // --- Note Management ---
        function loadNote() {
            dom.editorArea.value = localStorage.getItem(`tb_note_${currentId}`) || '';
        }

        function triggerSave() {
            localStorage.setItem(`tb_note_${currentId}`, dom.editorArea.value);
            dom.saveStatus.style.opacity = '1';
            setTimeout(() => dom.saveStatus.style.opacity = '0', 2000);
        }

        let timeoutId;
        dom.editorArea.addEventListener('input', () => {
            clearTimeout(timeoutId);
            timeoutId = setTimeout(triggerSave, 1000);
        });

        dom.quoteBtn.addEventListener('click', () => {
            const selection = window.getSelection().toString();
            if (selection) {
                const quoteText = `> ${selection.trim()}\n\n`;
                const start = dom.editorArea.selectionStart;
                const end = dom.editorArea.selectionEnd;
                const text = dom.editorArea.value;
                dom.editorArea.value = text.slice(0, start) + quoteText + text.slice(end);
                triggerSave();
                dom.editorArea.focus();
            }
        });

        // Robust Copy Function
        function copyTextToClipboard(text, btnElement) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            
            // Ensure textarea is not visible but part of DOM
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            textArea.style.top = "0";
            document.body.appendChild(textArea);
            
            textArea.focus();
            textArea.select();

            try {
                const successful = document.execCommand('copy');
                if (successful && btnElement) {
                    const original = btnElement.innerHTML;
                    btnElement.innerHTML = '<i data-lucide="check" class="w-4 h-4 text-green-500"></i>';
                    lucide.createIcons();
                    setTimeout(() => {
                        btnElement.innerHTML = original;
                        lucide.createIcons();
                    }, 2000);
                }
            } catch (err) {
                console.error('Fallback: Oops, unable to copy', err);
            }

            document.body.removeChild(textArea);
        }

        dom.copyNoteBtn.addEventListener('click', () => {
            copyTextToClipboard(dom.editorArea.value, dom.copyNoteBtn);
        });

        dom.clearNoteBtn.addEventListener('click', () => {
            openModal(() => {
                dom.editorArea.value = '';
                triggerSave();
            });
        });

        dom.zenToggle.addEventListener('click', () => {
            document.body.classList.toggle('zen-mode');
        });
    </script>
</body>
</html>
